name: Tests

# Läuft für Pull Requests und manuell – veröffentlicht nichts.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit-Tests und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser-Tests (Chromium + WebKit/Safari)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser installieren
        # Download hing einmal 20 min → eigenes Zeitlimit und ein zweiter Versuch
        timeout-minutes: 12
        run: |
          for i in 1 2; do
            timeout 300 npx playwright install --with-deps chromium webkit && exit 0
            echo "Installation fehlgeschlagen oder hängt (Versuch $i) – erneut"
          done
          exit 1
      - name: E2E (Telefon, Tablet, iPhone, iPad)
        run: npx playwright test
        env:
          CI: "1"
          E2E_WEBKIT: "1"
      - name: Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
